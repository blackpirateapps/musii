name: Android Signing Report

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/signing-report.yml'
    branches: [ main ]

jobs:
  signing-report:
    name: Generate Android Signing Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies & Flutter Gradle plugins
        run: flutter pub get

      - name: Configure Keystore from Secrets (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release keystore detected in repository secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
            EOF
            echo "CUSTOM_KEYSTORE_PRESENT=true" >> $GITHUB_ENV
          else
            echo "No release keystore secret found. Reporting default debug signing."
            echo "CUSTOM_KEYSTORE_PRESENT=false" >> $GITHUB_ENV
          fi

      - name: Run Gradle Signing Report
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew signingReport --console=plain > ../signing-report.txt
          cat ../signing-report.txt

      - name: Direct Keytool Analysis of Release Keystore
        if: env.CUSTOM_KEYSTORE_PRESENT == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "=== RELEASE KEYSTORE DETAILS ===" >> signing-report.txt
          keytool -list -v -keystore android/app/upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" >> signing-report.txt || true

      - name: Publish Summary to GitHub Actions
        run: |
          echo "## 🔐 Android Certificate Fingerprints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Variant | SHA-1 Fingerprint |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          
          # Extract SHA1 lines from signing report
          grep -E "Variant:|Config:|SHA1:" signing-report.txt | while read -r line; do
            echo "- \`$line\`" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Signing Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          cat signing-report.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Signing Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-report
          path: signing-report.txt
          retention-days: 30
